<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Contrarreloj NIC 8</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: marcador de estadio arriba (tiempo, nivel, puntos); tarjeta de pregunta debajo; una columna en todo ancho. */
:root{
  --bg:#E9EDF2; --panel:#FFFFFF; --ink:#18212E; --muted:#5B6878; --line:#CDD5DF;
  --clock:#D9861A; --clock-hot:#C0392B; --good:#1F7A45; --good-soft:#DDF1E4; --bad:#B23838; --bad-soft:#F8E0E0;
  --debe:#13706B; --haber:#7C3F73; --board:#18212E; --board-ink:#F3F5F8;
  --f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif; --f-body:'Atkinson Hyperlegible','Segoe UI',Arial,sans-serif; --f-num:'JetBrains Mono','Courier New',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141C; --panel:#17202B; --ink:#E7ECF2; --muted:#98A6B6; --line:#2B3746;
  --clock:#F2A33A; --clock-hot:#F06A5C; --good:#5ACB86; --good-soft:#163524; --bad:#F07C7C; --bad-soft:#3D1D1D;
  --debe:#4EC3B9; --haber:#D892C9; --board:#070B10; --board-ink:#F3F5F8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141C; --panel:#17202B; --ink:#E7ECF2; --muted:#98A6B6; --line:#2B3746;
  --clock:#F2A33A; --clock-hot:#F06A5C; --good:#5ACB86; --good-soft:#163524; --bad:#F07C7C; --bad-soft:#3D1D1D;
  --debe:#4EC3B9; --haber:#D892C9; --board:#070B10; --board-ink:#F3F5F8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.board{background:var(--board);color:var(--board-ink);border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:12px 18px;align-items:center}
.brand{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,6vw,40px);line-height:.9;letter-spacing:.02em;text-transform:uppercase}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;letter-spacing:.14em;opacity:.7;text-transform:uppercase}
.timebar{height:10px;border-radius:10px;background:rgba(255,255,255,.14);overflow:hidden;grid-column:1/-1}
.timebar i{display:block;height:100%;width:100%;background:var(--clock);transition:width .1s linear}
.timebar.hot i{background:var(--clock-hot)}
.stats{display:flex;gap:16px;justify-content:flex-end;flex-wrap:wrap}
.stat{text-align:right}
.stat span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.stat b{font-family:var(--f-num);font-size:22px}
.clock{font-family:var(--f-display);font-weight:900;font-size:56px;line-height:1;color:var(--clock);min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.clock.hot{color:var(--clock-hot)}
@media (max-width:520px){.board{grid-template-columns:1fr auto}.stats{grid-column:1/-1;justify-content:space-between}.stat{text-align:left}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,4vw,28px);min-width:0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1,h2{font-family:var(--f-display);font-weight:900;text-transform:uppercase;letter-spacing:.01em;line-height:1;margin:6px 0 14px;text-wrap:balance}
h1{font-size:clamp(34px,7vw,52px)} h2{font-size:clamp(26px,5vw,36px)}
.q{font-size:clamp(18px,3.2vw,22px);font-weight:700;margin:6px 0 16px;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo .opt{text-align:center;font-family:var(--f-display);font-weight:900;font-size:30px;text-transform:uppercase;padding:20px 8px}
.duo .opt.d{color:var(--debe)} .duo .opt.h{color:var(--haber)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.trio .opt{text-align:center;font-weight:700;padding:18px 6px}
@media (max-width:420px){.trio{grid-template-columns:1fr}}
button:focus-visible{outline:3px solid var(--clock);outline-offset:2px}
table.led{width:100%;border-collapse:collapse;font-size:15px;margin:0 0 16px}
.led th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:2px solid var(--ink);padding:6px}
.led td{border-bottom:1px solid var(--line);padding:7px 6px}
.led td.n{font-family:var(--f-num);text-align:right;white-space:nowrap}
.led tr.gap td{background:var(--bad-soft);font-weight:700;text-align:center;letter-spacing:.2em}
.scroll{overflow-x:auto}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border:2px solid}
.fb.ok{background:var(--good-soft);border-color:var(--good)} .fb.no{background:var(--bad-soft);border-color:var(--bad)}
.fb h3{margin:0 0 4px;font-size:17px} .fb p{margin:0}
.fb .pts{font-family:var(--f-num)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.primary{background:var(--ink);color:var(--panel);border:0;border-radius:12px;padding:13px 20px;font:inherit;font-weight:700;cursor:pointer}
.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:11px 18px;font:inherit;cursor:pointer}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.levels div{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.levels b{display:block;font-family:var(--f-display);font-size:20px;text-transform:uppercase}
.levels span{font-size:13px;color:var(--muted)}
.start label{display:block;font-weight:700;margin:12px 0 6px}
.start input{width:100%;max-width:380px;font:inherit;padding:13px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink)}
.stars{font-size:34px;letter-spacing:6px;color:var(--clock)}
.stars .off{color:var(--line)}
.sumtab{width:100%;border-collapse:collapse;margin:10px 0 16px;font-variant-numeric:tabular-nums}
.sumtab th,.sumtab td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.sumtab td.n{text-align:right;font-family:var(--f-num)}
.note{font-size:14px;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:900;font-size:64px;line-height:1;color:var(--clock)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <section class="board" aria-label="Marcador">
    <div class="brand">Contrarreloj<small>NIC 8 · asientos</small></div>
    <div class="clock" id="clock" aria-live="off">20</div>
    <div class="stats">
      <div class="stat"><span>Nivel</span><b id="lvl">–</b></div>
      <div class="stat"><span>Puntos</span><b id="pts">0</b></div>
      <div class="stat"><span>Racha</span><b id="stk">0</b></div>
    </div>
    <div class="timebar" id="bar"><i id="barFill"></i></div>
  </section>
  <main class="card" id="stage" aria-live="polite"></main>
</div>

<script>
const T = 20; // segundos por pregunta
const LEVELS = [
 { name:'Nivel 1', title:'Naturaleza de la cuenta', type:'dh', items:[
  {q:'Aumenta el activo por impuesto diferido.', a:'D', w:'Es un activo: los activos aumentan por el Debe.'},
  {q:'Aumenta la provisión por VNR de inventarios.', a:'H', w:'Es una cuenta correctora del inventario (le resta valor): aumenta por el Haber.'},
  {q:'Disminuyen los resultados acumulados por un error de 2024.', a:'D', w:'Es patrimonio: disminuye por el Debe.'},
  {q:'Se paga y cancela la provisión por litigios.', a:'D', w:'Es un pasivo que desaparece: los pasivos disminuyen por el Debe.'},
  {q:'Aumenta la amortización acumulada del software.', a:'H', w:'Es correctora del intangible: aumenta por el Haber.'},
  {q:'Aumentan los bonos por pagar a costo amortizado.', a:'H', w:'Es un pasivo: los pasivos aumentan por el Haber.'}]},
 { name:'Nivel 2', title:'¿Política, estimación o error?', type:'pee', items:[
  {q:'No se aplicó el ajuste a VNR en 2024, aunque la obsolescencia ya se conocía.', a:'Error', w:'La información existía en 2024 y no se usó (NIC 8 párr. 5).'},
  {q:'Este año se decide migrar a la nube y el software durará 2 años menos.', a:'Estimación', w:'Información nueva: cambia la vida útil, se aplica de forma prospectiva (párr. 34 y 36).'},
  {q:'Una ley nueva aumenta la provisión por desmantelamiento.', a:'Estimación', w:'Hecho nuevo que cambia un importe estimado (párr. 34).'},
  {q:'La empresa pasa sus propiedades de inversión del costo al valor razonable.', a:'Política', w:'Cambia la base de medición (párr. 14(b); NIC 40 párr. 30).'},
  {q:'Un litigio era probable en 2024 y no se provisionó.', a:'Error', w:'Omisión con información disponible al cierre (párr. 5).'},
  {q:'Los intereses de 2024 se calcularon mal con el interés efectivo.', a:'Error', w:'La regla y los datos existían: falló el cálculo (párr. 41).'}]},
 { name:'Nivel 3', title:'¿Contra qué cuenta?', type:'mc', items:[
  {q:'Corriges en 2025 un error material de 2024. El efecto va a…', o:['Gasto del año 2025','Resultados acumulados','Superávit por revaluación','Solo se revela'], a:1, w:'La corrección se excluye del resultado del año en que se descubre (párr. 46).'},
  {q:'Aumenta la provisión por desmantelamiento (modelo del costo). Se debita…', o:['Gasto por desmantelamiento','Resultados acumulados','El costo de la maquinaria','Bancos'], a:2, w:'El aumento se suma al costo del activo (CINIIF 1 párr. 5(a)).'},
  {q:'Se acorta la vida útil del software. El efecto va a…', o:['Resultados acumulados','El gasto por amortización desde este año','Superávit por revaluación','No se registra'], a:1, w:'Es estimación: prospectivo, cambia la cuota desde ahora (párr. 36).'},
  {q:'El ajuste a VNR se podrá deducir cuando se venda el inventario. Ese beneficio futuro es…', o:['Impuesto por pagar','Activo por impuesto diferido','Gasto del año','Ingreso del año'], a:1, w:'Diferencia temporaria deducible: genera un activo por impuesto diferido (NIC 12 párr. 24).'},
  {q:'Por un error de 2024 se pagó impuesto de más y habrá declaración sustitutiva. Se debita…', o:['Impuesto a la renta por recuperar','Activo por impuesto diferido','Gasto por impuesto 2025','Bonos por pagar'], a:0, w:'El impuesto pagado de más se convierte en un derecho de cobro inmediato.'}]},
 { name:'Nivel 4', title:'Completa el asiento', type:'je', items:[
  {t:'Error de VNR con impuesto diferido (ajuste 22.000, tasa 25%)', rows:[['Resultados acumulados',16500,0],['Activo por impuesto diferido',5500,0],null], o:['Provisión por VNR de inventarios · Haber 22.000','Inventarios · Debe 22.000','Gasto por VNR · Debe 22.000','Provisión por VNR de inventarios · Haber 16.500'], a:0, w:'La provisión baja el inventario en 22.000 y crece por el Haber. Debe = 16.500 + 5.500 = 22.000 = Haber.'},
  {t:'Aumento del desmantelamiento de 15.000 a 40.000', rows:[null,['Provisión por desmantelamiento',0,25000]], o:['Gasto por desmantelamiento · Debe 25.000','Maquinaria – costo de desmantelamiento · Debe 25.000','Resultados acumulados · Debe 25.000','Maquinaria – costo de desmantelamiento · Debe 40.000'], a:1, w:'El aumento (40.000 − 15.000) se suma al costo del activo, no al gasto.'},
  {t:'Nueva cuota del software (70.000 ÷ 2 años)', rows:[['Gasto por amortización',35000,0],null], o:['Software · Debe 35.000','Amortización acumulada – software · Haber 20.000','Amortización acumulada – software · Haber 35.000','Resultados acumulados · Haber 35.000'], a:2, w:'La amortización acumulada es correctora y crece por el Haber, por el mismo importe del gasto.'},
  {t:'Pago de la sentencia ya provisionada (30.000)', rows:[['Provisión por litigios',30000,0],null], o:['Gasto por litigios · Debe 30.000','Bancos · Haber 30.000','Resultados acumulados · Haber 30.000','Bancos · Debe 30.000'], a:1, w:'Sale el efectivo: Bancos (activo) disminuye por el Haber. No hay gasto nuevo.'},
  {t:'Error de interés efectivo (12.500, tasa 25%)', rows:[['Resultados acumulados',9375,0],['Impuesto a la renta por recuperar',3125,0],null], o:['Gasto por intereses · Debe 12.500','Bonos por pagar · Haber 9.375','Bonos por pagar (costo amortizado) · Haber 12.500','Activo por impuesto diferido · Debe 3.125'], a:2, w:'El bono estaba subestimado en 12.500: el pasivo aumenta por el Haber.'},
  {t:'Propiedad de inversión: del costo al valor razonable', rows:[['Propiedad de inversión (valor razonable)',450000,0],null,['Propiedad de inversión (costo)',0,400000],['Resultados acumulados',0,80000]], o:['Depreciación acumulada · Haber 30.000','Depreciación acumulada · Debe 30.000','Gasto por depreciación · Debe 30.000','Superávit por revaluación · Haber 30.000'], a:1, w:'La depreciación acumulada se elimina: como su saldo es acreedor, se debita. Debe 480.000 = Haber 480.000.'}]},
 { name:'Nivel 5', title:'Cálculo rápido', type:'mc', items:[
  {q:'Ajuste a VNR de 36.000, tasa 25%. ¿Activo por impuesto diferido?', o:['4.500','9.000','27.000','36.000'], a:1, w:'36.000 × 25% = 9.000.'},
  {q:'El mismo caso: ¿cuánto se debita a resultados acumulados?', o:['36.000','9.000','27.000','45.000'], a:2, w:'36.000 − 9.000 = 27.000: la pérdida neta del ahorro de impuesto.'},
  {q:'Importe en libros del software 90.000; se usará 3 años más. ¿Nueva cuota?', o:['15.000','30.000','45.000','9.000'], a:1, w:'90.000 ÷ 3 = 30.000. Se reparte solo lo que falta.'},
  {q:'La provisión pasa de 20.000 a 52.000; vida remanente 8 años. ¿Depreciación adicional anual?', o:['32.000','6.500','4.000','2.500'], a:2, w:'(52.000 − 20.000) ÷ 8 = 4.000.'},
  {q:'Intereses subestimados en 16.000, tasa 25%, gasto deducible. ¿Débito a resultados acumulados?', o:['16.000','12.000','4.000','20.000'], a:1, w:'16.000 − 4.000 de impuesto por recuperar = 12.000.'},
  {q:'Costo 300.000, depreciación acumulada 40.000, valor razonable 300.000. ¿Ajuste a resultados acumulados?', o:['0','260.000','40.000','300.000'], a:2, w:'300.000 − (300.000 − 40.000) = 40.000.'}]}
];
const TOTALQ = LEVELS.reduce((a, l) => a + l.items.length, 0);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n.toLocaleString('es-EC');

let S = { alias:'', lv:0, i:0, pts:0, stk:0, best:0, log:[], phase:'start', started:null };
let timer = null, left = T, t0 = 0;

function hud(){ $('pts').textContent = S.pts; $('stk').textContent = S.stk; $('lvl').textContent = S.phase === 'q' || S.phase === 'fb' ? `${S.lv + 1}/5` : '–'; }
function setClock(sec){ const s = Math.max(0, sec); $('clock').textContent = Math.ceil(s); $('barFill').style.width = (s / T * 100) + '%'; const hot = s <= 5; $('clock').classList.toggle('hot', hot); $('bar').classList.toggle('hot', hot); }
function stopTimer(){ clearInterval(timer); timer = null; }
function startTimer(onEnd){ stopTimer(); left = T; t0 = performance.now(); setClock(T); timer = setInterval(() => { left = T - (performance.now() - t0) / 1000; setClock(left); if (left <= 0){ stopTimer(); onEnd(); } }, 100); }

function render(){
  hud();
  const st = $('stage');
  if (S.phase === 'start') return renderStart(st);
  if (S.phase === 'intro') return renderIntro(st);
  if (S.phase === 'q') return renderQ(st);
  if (S.phase === 'lvdone') return renderLvDone(st);
  if (S.phase === 'end') return renderEnd(st);
}

function renderStart(st){
  setClock(T);
  st.innerHTML = `<div class="eyebrow">Repaso con tiempo</div><h1>20 segundos por pregunta</h1>
  <p>Cinco niveles sobre los asientos de la NIC 8. Responde antes de que se acabe el reloj: cuanto más rápido aciertas, más puntos sumas. Después de cada respuesta verás la explicación, y al final podrás descargar tu hoja de avance en PDF.</p>
  <div class="levels">${LEVELS.map(l => `<div><b>${esc(l.name)}</b><span>${esc(l.title)} · ${l.items.length} preguntas</span></div>`).join('')}</div>
  <p class="note">Acierto: 100 puntos + 5 por cada segundo que te sobre. Desde 3 aciertos seguidos, +20 de racha. Si se acaba el tiempo, la pregunta cuenta como no respondida.</p>
  <form class="start" id="f"><label for="alias">Tu nombre completo (aparecerá en tu hoja de avance)</label>
  <div class="row" style="margin-top:0"><input id="alias" maxlength="40" autocomplete="name" placeholder="Ej.: Ana Pérez" required><button class="primary" type="submit">Empezar</button></div></form>`;
  $('f').onsubmit = e => { e.preventDefault(); const v = $('alias').value.trim(); if (!v) return; S.alias = v; S.started = new Date(); S.phase = 'intro'; render(); };
}
function renderIntro(st){
  const L = LEVELS[S.lv]; setClock(T);
  st.innerHTML = `<div class="eyebrow">${esc(L.name)} de 5</div><h2>${esc(L.title)}</h2><p>${L.items.length} preguntas · ${T} segundos cada una.</p><div class="row"><button class="primary" id="go" type="button">¡Listo, empezar!</button></div>`;
  $('go').onclick = () => { S.phase = 'q'; render(); }; $('go').focus();
}

function optionsHTML(L, it){
  if (L.type === 'dh') return `<div class="duo"><button class="opt d" data-v="D" type="button">Debe</button><button class="opt h" data-v="H" type="button">Haber</button></div>`;
  if (L.type === 'pee') return `<div class="trio">${['Política','Estimación','Error'].map(x => `<button class="opt" data-v="${x}" type="button">${x}</button>`).join('')}</div>`;
  return `<div class="opts">${it.o.map((o, k) => `<button class="opt" data-v="${k}" type="button">${esc(o)}</button>`).join('')}</div>`;
}
function correctLabel(L, it){ if (L.type === 'dh') return it.a === 'D' ? 'Debe' : 'Haber'; if (L.type === 'pee') return it.a; return it.o[it.a]; }
function chosenLabel(L, it, v){ if (v == null) return 'Sin respuesta (tiempo agotado)'; if (L.type === 'dh') return v === 'D' ? 'Debe' : 'Haber'; if (L.type === 'pee') return v; return it.o[+v]; }
function isRight(L, it, v){ if (L.type === 'dh' || L.type === 'pee') return v === it.a; return +v === it.a; }

function renderQ(st){
  const L = LEVELS[S.lv], it = L.items[S.i];
  let body = '';
  if (L.type === 'je'){
    body = `<p class="q">${esc(it.t)}: ¿qué línea falta?</p><div class="scroll"><table class="led"><thead><tr><th>Cuenta</th><th style="text-align:right">Debe</th><th style="text-align:right">Haber</th></tr></thead><tbody>${it.rows.map(r => r ? `<tr><td>${esc(r[0])}</td><td class="n">${r[1] ? fmt(r[1]) : ''}</td><td class="n">${r[2] ? fmt(r[2]) : ''}</td></tr>` : `<tr class="gap"><td colspan="3">? ? ?</td></tr>`).join('')}</tbody></table></div>`;
  } else body = `<p class="q">${esc(it.q)}</p>`;
  st.innerHTML = `<div class="eyebrow">${esc(L.name)} · ${esc(L.title)} · Pregunta ${S.i + 1} de ${L.items.length}</div>${body}${optionsHTML(L, it)}<div id="fbk"></div>`;
  const answer = v => {
    stopTimer();
    const secs = Math.max(0, left), ok = v != null && isRight(L, it, v);
    let gain = 0;
    if (ok){ gain = 100 + Math.round(secs) * 5; S.stk++; S.best = Math.max(S.best, S.stk); if (S.stk >= 3) gain += 20; } else S.stk = 0;
    S.pts += gain;
    S.log.push({ lv:S.lv, q: L.type === 'je' ? it.t + ': ¿qué línea falta?' : it.q, tu: chosenLabel(L, it, v), ok, correcta: correctLabel(L, it), w: it.w, t: Math.round((T - secs) * 10) / 10, gain, timeout: v == null });
    st.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (isRight(L, it, b.dataset.v)) b.classList.add('right'); else if (b.dataset.v === v) b.classList.add('wrong'); });
    const title = ok ? '¡Correcto!' : (v == null ? '¡Se acabó el tiempo!' : 'No es correcto');
    const sub = ok ? '' : `<p><b>Respuesta correcta:</b> ${esc(correctLabel(L, it))}</p>`;
    $('fbk').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><h3>${title} ${ok ? `<span class="pts">+${gain}</span>` : ''}</h3>${sub}<p>${esc(it.w)}</p></div><div class="row"><button class="primary" id="nx" type="button">${S.i + 1 < L.items.length ? 'Siguiente pregunta' : 'Terminar nivel'}</button></div>`;
    hud(); $('nx').onclick = () => { S.i++; if (S.i >= L.items.length){ S.i = 0; S.phase = 'lvdone'; } render(); }; $('nx').focus();
  };
  st.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b.dataset.v));
  startTimer(() => answer(null));
}

function levelStats(k){ const l = S.log.filter(x => x.lv === k); const ok = l.filter(x => x.ok).length; const avg = l.length ? l.reduce((a, x) => a + x.t, 0) / l.length : 0; return { n: l.length, ok, avg, pts: l.reduce((a, x) => a + x.gain, 0) }; }
const starsFor = (ok, n) => { const p = n ? ok / n : 0; return p >= .99 ? 3 : p >= .66 ? 2 : p >= .33 ? 1 : 0; };
function renderLvDone(st){
  setClock(T);
  const k = S.lv, s = levelStats(k), stars = starsFor(s.ok, s.n), last = k === LEVELS.length - 1;
  st.innerHTML = `<div class="eyebrow">${esc(LEVELS[k].name)} terminado</div><h2>${esc(LEVELS[k].title)}</h2>
  <div class="stars" aria-label="${stars} de 3 estrellas">${[0,1,2].map(i => `<span class="${i < stars ? '' : 'off'}">★</span>`).join('')}</div>
  <p>Aciertos: <b>${s.ok} de ${s.n}</b> · Tiempo promedio: <b>${s.avg.toFixed(1)} s</b> · Puntos del nivel: <b>${s.pts}</b></p>
  <div class="row"><button class="primary" id="nx" type="button">${last ? 'Ver mis resultados' : 'Siguiente nivel'}</button><button class="ghost" id="rp" type="button">Repetir este nivel</button></div>`;
  $('nx').onclick = () => { if (last){ S.phase = 'end'; } else { S.lv++; S.phase = 'intro'; } render(); };
  $('rp').onclick = () => { S.pts -= s.pts; S.log = S.log.filter(x => x.lv !== k); S.i = 0; S.phase = 'intro'; render(); };
  $('nx').focus();
}

function badges(){
  const tot = S.log.filter(x => x.ok).length, fast = S.log.filter(x => x.ok && x.t <= 8).length, nto = S.log.filter(x => x.timeout).length;
  return [['Partida doble', levelStats(0).ok === LEVELS[0].items.length], ['Clasificador NIC 8', levelStats(1).ok === LEVELS[1].items.length], ['Asiento perfecto', levelStats(3).ok === LEVELS[3].items.length], ['Calculadora humana', levelStats(4).ok === LEVELS[4].items.length], ['Rayo (10 aciertos en 8 s o menos)', fast >= 10], ['Sin tiempo perdido (0 preguntas agotadas)', nto === 0 && S.log.length === TOTALQ], ['Racha de 8', S.best >= 8]].map(b => ({ n: b[0], on: !!b[1] }));
}
function renderEnd(st){
  stopTimer(); setClock(0);
  const ok = S.log.filter(x => x.ok).length, pct = Math.round(ok / TOTALQ * 100), b = badges().filter(x => x.on);
  st.innerHTML = `<div class="eyebrow">Resultados de ${esc(S.alias)}</div><div class="big">${S.pts}</div><p>puntos · <b>${ok} de ${TOTALQ}</b> aciertos (${pct}%) · mejor racha: ${S.best}</p>
  <table class="sumtab"><thead><tr><th>Nivel</th><th style="text-align:right">Aciertos</th><th style="text-align:right">Tiempo promedio</th><th style="text-align:right">Puntos</th></tr></thead><tbody>${LEVELS.map((l, k) => { const s = levelStats(k); return `<tr><td>${esc(l.name)} · ${esc(l.title)}</td><td class="n">${s.ok}/${l.items.length}</td><td class="n">${s.avg.toFixed(1)} s</td><td class="n">${s.pts}</td></tr>`; }).join('')}</tbody></table>
  <p><b>Insignias:</b> ${b.length ? b.map(x => esc(x.n)).join(' · ') : 'ninguna todavía. ¡Inténtalo otra vez!'}</p>
  <div class="row"><button class="primary" id="pdf" type="button">Descargar mi hoja de avance (PDF)</button><button class="ghost" id="again" type="button">Jugar de nuevo</button></div>
  <p class="note" id="pdfMsg">La hoja incluye tus aciertos por nivel y la explicación de cada pregunta que fallaste.</p>`;
  $('pdf').onclick = downloadPDF;
  $('again').onclick = () => { S = { alias:S.alias, lv:0, i:0, pts:0, stk:0, best:0, log:[], phase:'intro', started:new Date() }; render(); };
}

// ---------- PDF ----------
const pdfSafe = s => String(s).replace(/[−–—]/g, '-').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/…/g, '...').replace(/÷/g, '/').replace(/×/g, 'x').replace(/★/g, '*').replace(/[^\x00-\xFF]/g, '');
function buildPDF(){
  const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit:'mm', format:'a4' });
  const W = 210, M = 16, CW = W - 2 * M; let y = 18;
  const ensure = h => { if (y + h > 282){ doc.addPage(); y = 18; } };
  const text = (s, size = 10, style = 'normal', color = [24, 33, 46]) => { doc.setFont('helvetica', style); doc.setFontSize(size); doc.setTextColor(...color); const lines = doc.splitTextToSize(pdfSafe(s), CW); ensure(lines.length * size * 0.42 + 1); doc.text(lines, M, y); y += lines.length * size * 0.42 + 1.5; };
  doc.setFillColor(24, 33, 46); doc.rect(0, 0, W, 30, 'F');
  doc.setTextColor(243, 245, 248); doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.text('Hoja de avance - Contrarreloj NIC 8', M, 14);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.text(pdfSafe('Repaso de asientos: políticas, estimaciones y errores'), M, 21);
  y = 40;
  const ok = S.log.filter(x => x.ok).length, pct = Math.round(ok / TOTALQ * 100), d = new Date();
  text('Estudiante: ' + S.alias, 12, 'bold');
  text('Fecha: ' + d.toLocaleDateString('es-EC') + ' ' + d.toLocaleTimeString('es-EC', { hour:'2-digit', minute:'2-digit' }), 10);
  text(`Puntaje: ${S.pts} puntos   |   Aciertos: ${ok} de ${TOTALQ} (${pct}%)   |   Mejor racha: ${S.best}`, 11, 'bold', [217, 134, 26]);
  y += 2;
  // tabla de niveles
  const cols = [M, M + 92, M + 122, M + 152];
  doc.setFillColor(233, 237, 242); doc.rect(M, y - 4.5, CW, 7, 'F'); doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(24, 33, 46);
  ['Nivel', 'Aciertos', 'Tiempo prom.', 'Puntos'].forEach((h, k) => doc.text(h, cols[k] + 1, y)); y += 6;
  doc.setFont('helvetica', 'normal');
  LEVELS.forEach((l, k) => { const s = levelStats(k); doc.text(pdfSafe(`${l.name}: ${l.title}`), cols[0] + 1, y); doc.text(`${s.ok}/${l.items.length}`, cols[1] + 1, y); doc.text(`${s.avg.toFixed(1)} s`, cols[2] + 1, y); doc.text(String(s.pts), cols[3] + 1, y); doc.setDrawColor(205, 213, 223); doc.line(M, y + 2, M + CW, y + 2); y += 6.5; });
  y += 3;
  const b = badges().filter(x => x.on);
  text('Insignias obtenidas: ' + (b.length ? b.map(x => x.n).join(', ') : 'ninguna'), 10, 'bold');
  // recomendación
  const weak = LEVELS.map((l, k) => ({ l, s: levelStats(k) })).filter(x => x.s.n && x.s.ok / x.s.n < .7).map(x => x.l.title);
  text('Recomendación: ' + (weak.length ? 'repasa ' + weak.join(', ') + '. Vuelve a jugar esos niveles y revisa las explicaciones de abajo.' : 'muy buen dominio. Repasa las explicaciones de las preguntas falladas, si las hay.'), 10);
  y += 3;
  text('Retroalimentación: preguntas por repasar', 13, 'bold');
  const miss = S.log.filter(x => !x.ok);
  if (!miss.length) text('¡Respondiste todo correctamente! No hay preguntas pendientes.', 10);
  miss.forEach((x, n) => {
    ensure(26);
    text(`${n + 1}. [${LEVELS[x.lv].name}] ${x.q}`, 10, 'bold');
    text('Tu respuesta: ' + x.tu, 9.5, 'normal', [178, 56, 56]);
    text('Respuesta correcta: ' + x.correcta, 9.5, 'normal', [31, 122, 69]);
    text('Por qué: ' + x.w, 9.5);
    y += 1.5;
  });
  y += 2;
  text('Todas las respuestas', 13, 'bold');
  S.log.forEach((x, n) => text(`${n + 1}. ${x.ok ? 'Correcta' : (x.timeout ? 'Tiempo agotado' : 'Incorrecta')} (${x.t.toFixed(1)} s, +${x.gain}) - ${x.q}`, 8.5, 'normal', x.ok ? [31, 122, 69] : [178, 56, 56]));
  const pages = doc.getNumberOfPages();
  for (let p = 1; p <= pages; p++){ doc.setPage(p); doc.setFontSize(8); doc.setTextColor(91, 104, 120); doc.text(`Contrarreloj NIC 8 - ${pdfSafe(S.alias)} - página ${p} de ${pages}`, M, 290); }
  return doc;
}
async function downloadPDF(){
  const msg = $('pdfMsg');
  if (!window.jspdf){ msg.textContent = 'No se pudo preparar el PDF en esta vista. Toma una captura de pantalla de tus resultados.'; return; }
  let dl = null; try { dl = window.claude?.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (!dl){ msg.textContent = 'La descarga no está disponible en esta vista. Toma una captura de pantalla de tus resultados.'; return; }
  try {
    const blob = buildPDF().output('blob');
    const name = 'Avance_NIC8_' + S.alias.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_') + '.pdf';
    await dl.save({ filename: name, data: blob });
    msg.textContent = 'Listo: tu hoja de avance se guardó.';
  } catch (e) {
    msg.textContent = e && e.code === 'declined' ? 'Cancelaste la descarga. Puedes volver a intentarlo con el botón.' : 'No se pudo guardar el PDF. Inténtalo de nuevo en unos segundos.';
  }
}
render();
</script>

</body></html>
